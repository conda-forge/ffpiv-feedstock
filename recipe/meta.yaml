{% set name = "ffpiv" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/ffpiv-{{ version }}.tar.gz
  sha256: 7522748a7ad6b2829afe22cec7de1518a0d8b49eeb1213b9b9a71e7872b38da4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.4.0,<4
    - pip
  run:
    - python >={{ python_min }}
    - matplotlib-base
    - numba >0.56
    - numpy <2
    - pillow
    - pip
    - pooch
    - psutil
    - pyfftw
    - rocket-fft

test:
  imports:
    - ffpiv
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/localdevices/ffpiv
  summary: 'FF-PIV: Fast and Flexible Particle Image Velocimetry analysis powered by numba.'
  dev_url: https://github.com/localdevices/ffpiv
  license: AGPL-3.0-only
  license_family: GPL
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hcwinsemius
